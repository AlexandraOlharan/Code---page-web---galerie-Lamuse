<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inria+Serif:wght@300;400;700&display=swap" rel="stylesheet">

</head>

<body>

     <link rel="stylesheet" href="style.css">
    

    <section class="artistes">
    <h2>Nos Artistes</h2>

    <div class="grille">

        <div class="carte">
            <img src="Images/degrade.jpg" alt="dégradé">
            <p>Eva Lautier</p>
        </div>

        <div class="carte">
            <img src="Images/bain.jpg" alt="bain">
            <p>Anne-Sophie Paris</p>
        </div>

        <div class="carte">
            <img src="Images/tag.jpg" alt="tag">
            <p>Jeanne Fostner</p>
        </div>

        <div class="carte">
            <img src="Images/paysage.jpg" alt="paysage">
            <p>Josiane Lucas</p>
        </div>

        <div class="carte">
            <img src="Images/main.jpg" alt="main">
            <p>France Chevalier</p>
        </div>

        <div class="carte">
            <img src="Images/coulis.jpg" alt="coulis">
            <p>Marie Rose</p>
        </div>

    </div>

</section>


    <h2>Oeuvres</h2>

    <div class="gallery">

        <div class="col">
            <img src="images/temple.png" alt="Temple">
            <img src="images/table.jpg" alt="Nature morte">
            <img src="images/tapisserie.png" alt="Tapisserie">
        </div>

        <div class="col">
            <img src="images/danseuse.png" alt="Danseuse">
            <img src="images/femme.jpg" alt="Femme">
        </div>

        <div class="col">
            <img src="images/arbre.png" alt="Arbre">
            <img src="images/vague.png" alt="Vague">
        </div>

    </div>

    <footer>
        <div class="contact">
            <h3>Nous contacter</h3>
            <p>
                06 76 54 30 00<br>
                lamuse.galeriedart@gmail.com
            </p>
        </div>

        <div class="adresse">
            <h3>Ou nous trouver ?</h3>
            <p>
                51 rue des fleurs, Nice, 06000<br>
                9h - 12h et 14h-17h
            </p>
        </div>
    </footer>

     <section class="news-letter">
    <div class="news-container">
        <img class="news-bg" src="Images/tableau.png" alt="Newsletter Background">
        <div class="news-content">
            <h2>Abonnez-vous gratuitement à notre News Letter</h2>
            <form id="newsletterForm" onsubmit="return validateForm()">
                <div class="form-row">
                    <div class="form-group">
                        <label for="prenom">Prénom :</label>
                        <input type="text" id="prenom" name="prenom" placeholder="Prénom">
                    </div>
                    <div class="form-group">
                        <label for="nom">Nom :</label>
                        <input type="text" id="nom" name="nom" placeholder="Nom">
                    </div>
                </div>

                <label for="email">Email :</label>
                <input type="email" id="email" name="email" placeholder="Email">

                <button type="submit">Soumettre</button>
            </form>
        </div>
    </div>
</section>
<script>

</body>
</html>
